name: Check the registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: kiplabat/KimiOS
          path: .kimios
      - name: Every entry passes KimiOS's own checks
        run: python3 tools/check.py --kimios .kimios/system_files/usr/libexec/kimios
      - name: The checker still rejects what it must
        run: python3 tools/test_check.py --kimios .kimios/system_files/usr/libexec/kimios

  index:
    # on main only: rebuild index.json, which KimiOS machines read, from the entries that pass
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: kiplabat/KimiOS
          path: .kimios
      - run: python3 tools/check.py --kimios .kimios/system_files/usr/libexec/kimios --write-index
      - name: Commit the index if it changed
        run: |
          git diff --quiet -- index.json && exit 0
          git config user.name "kimios-registry"
          git config user.email "kimios-registry@users.noreply.github.com"
          git add index.json
          git commit -m "index: rebuilt from the entries that pass"
          git push
